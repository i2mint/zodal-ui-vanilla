# npm auth: trusted publishing (OIDC) only. Never add an NPM_TOKEN secret.
# npmjs.com -> each package -> Settings -> Trusted Publisher -> GitHub Actions:
#   owner/repo = i2mint/zodal-ui-vanilla, workflow filename = ci.yml, no environment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  gate:
    name: Release gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.subject.outputs.publish }}
      force: ${{ steps.subject.outputs.force }}

    steps:
      - uses: actions/checkout@v6

      # Only the commit SUBJECT (first line) may arm a release. The previous gate matched the
      # whole commit message, so a commit that merely *mentioned* the marker in its body --
      # such as one documenting this very workflow -- published to npm for real.
      #
      # The subject is read with git rather than interpolated from the event payload, so an
      # arbitrary commit message can never be spliced into this shell.
      - id: subject
        run: |
          set -euo pipefail
          subject=$(git log -1 --pretty=%s)
          publish=false
          force=false
          case "$subject" in
            *'[force publish]'*) publish=true; force=true ;;
            *'[publish]'*)       publish=true ;;
          esac
          echo "subject: $subject"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"

  publish:
    needs: [validate, gate]
    runs-on: ubuntu-latest
    if: needs.gate.outputs.publish == 'true'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Ensure npm >= 11.5.1 (required for OIDC trusted publishing)
        run: |
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish to npm
        run: pnpm publish --access public --provenance --no-git-checks

      - name: Tag release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
